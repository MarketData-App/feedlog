name = "feedlog"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Bundle the Drizzle migrations folder into the Worker as Text modules so
# runtime-migrate can read `.sql` files and `meta/_journal.json` via
# node:fs under /bundle/... at request time. Combined with nuxt.config.ts's
# nitro.unenv.external for node:fs, this is what lets the /setup page run
# migrations on the very first request after deploy.
#
# Newer Workers runtimes (compatibility_date >= 2026-01-20) ship with a
# built-in `.sql` Text rule, but older wrangler CLIs fall back to an
# earlier runtime that lacks it — declaring both globs explicitly keeps
# the same behavior across wrangler versions.
find_additional_modules = true

[[rules]]
type = "Text"
globs = ["**/*.sql", "**/_journal.json"]
fallthrough = true

# Nitro puts a wasm import (Mastra's xxhash-wasm) in a nested chunk as
# `../../wasm/<name>.wasm`. find_additional_modules makes wrangler keep that
# path as written, but wrangler bundles every chunk into one index.js at the
# module root, where the path no longer resolves: the Worker then fails with
# `No such module "../../wasm/..."`. This rule matches only import paths that
# start with `../`, so module discovery skips the .wasm files and the bundler
# renames each such import to a root-level module. It replaces the default
# CompiledWasm rule (`**/*.wasm`); `fallthrough = false` says so on purpose.
[[rules]]
type = "CompiledWasm"
globs = ["../**/*.wasm"]
fallthrough = false

# Hyperdrive accelerates your external Postgres connection.
# Create one with: wrangler hyperdrive create feedlog --connection-string="postgresql://..."
# Replace the placeholder id below with the output. The one-click Deploy
# Button walks the user through creating a Hyperdrive config and patches the
# id in automatically.
[[hyperdrive]]
binding = "POSTGRES"
id = "REPLACE_WITH_YOUR_HYPERDRIVE_ID"

# R2 bucket for blob storage (file uploads).
# Create one with: wrangler r2 bucket create feedlog
[[r2_buckets]]
binding = "BLOB"
bucket_name = "feedlog"

# Public (non-secret) configuration.
# Secrets (BETTER_AUTH_SECRET, SYSTEM_ADMIN_EMAILS, GOOGLE_CLIENT_SECRET,
# OPENAI_API_KEY, etc.) must be set via `wrangler secret put <NAME>` or via
# the Deploy Button form (backed by .dev.vars.example), NOT declared here.
[vars]
BETTER_AUTH_URL = "https://your-worker.workers.dev"
# GOOGLE_CLIENT_ID = "your-google-oauth-client-id.apps.googleusercontent.com"

# Secrets to configure via `wrangler secret put` (manual-deploy path):
#   wrangler secret put BETTER_AUTH_SECRET       # random 32+ char string
#   wrangler secret put SYSTEM_ADMIN_EMAILS      # e.g. you@example.com
#   wrangler secret put GOOGLE_CLIENT_SECRET     # if enabling Google OAuth
#   wrangler secret put OPENAI_API_KEY           # if enabling AI features

[observability]
[observability.logs]
enabled = false
invocation_logs = true

[placement]
mode = "smart"

# Daily recovery; delayed messages invoke the shared queue consumer.
[triggers]
crons = ["0 3 * * *"]

[[queues.producers]]
binding = "INBOX_QUEUE"
queue = "feedlog-inbox"

[[queues.consumers]]
queue = "feedlog-inbox"
max_batch_size = 1
max_retries = 3
retry_delay = 60

# MarketData staging: https://roadmap-staging.marketdata.app
# Build and deploy: `pnpm deploy:staging`. It builds with CLOUDFLARE_ENV=staging,
# so NuxtHub flattens this section into .output/server/wrangler.json, and then
# runs `wrangler deploy --cwd .output --env staging`.
# Migrate: `pnpm migrate:staging`.
# Secrets: BETTER_AUTH_SECRET, RESEND_API_KEY, SYSTEM_ADMIN_EMAILS. Set them with
#   wrangler secret put <NAME> --config wrangler.toml --env staging
# Keep `--config wrangler.toml`: without it, wrangler reads the generated
# .output config, and a top-level build there names the Worker "feedlog".
# No queues here: the deploy token has no Queues permission, and the inbox
# feature is not used. Top-level queues are not inherited by environments.
[env.staging]
name = "feedlog-staging"
workers_dev = false
routes = [{ pattern = "roadmap-staging.marketdata.app/*", zone_name = "marketdata.app" }]

[[env.staging.hyperdrive]]
binding = "POSTGRES"
id = "95f7337ff2a74e0188ec3e7b0edd7256"

[[env.staging.r2_buckets]]
binding = "BLOB"
bucket_name = "feedlog-staging"

[env.staging.triggers]
crons = ["0 3 * * *"]

[env.staging.vars]
BETTER_AUTH_URL = "https://roadmap-staging.marketdata.app"
EMAIL_FROM = "MarketData Roadmap <roadmap@contact.marketdata.app>"
AUTH_EMAIL_ENABLED = "true"
# contact.marketdata.app is a send-only domain: no email verification on staging.
AUTH_EMAIL_VERIFY = "false"
MCP_ENABLED = "false"
EMAIL_ALLOWED_DOMAINS = "resend.dev,marketdata.app,contact.marketdata.app"
NOINDEX = "true"
# Every "Sign in" goes to the aMember feedlog-sso plugin (staging aMember),
# with return_to=<current URL>. Nuxt reads it at runtime as
# runtimeConfig.public.ssoLoginUrl and sends it to the browser in the page.
NUXT_PUBLIC_SSO_LOGIN_URL = "https://dashboard-staging.marketdata.app/marketdata/misc/feedlog-sso"
